name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    if: github.repository == 'tfmm/terraform-provider-gitea'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY || secrets.GPG_KEY }}
          passphrase: ${{ secrets.PASSPHRASE || secrets.GPG_PASSPHRASE }}
      - name: Verify GPG Key Import
        run: |
          echo "Imported GPG Fingerprint: '${GPG_FINGERPRINT}'"
          if [ -z "${GPG_FINGERPRINT}" ]; then
            echo "::error::GPG_FINGERPRINT is empty! Please check if GPG_PRIVATE_KEY secret is configured in GitHub repository settings."
          fi
          gpg --list-secret-keys
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: '~> v2'
      - name: Run GoReleaser
        run: |
          goreleaser release --clean --verbose 2>&1 | tee /tmp/goreleaser.log || {
            echo "### GoReleaser Execution Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat /tmp/goreleaser.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          # GitHub sets this automatically
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
